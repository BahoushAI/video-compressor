<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>کاهش حجم فیلم</title>
  <link rel="stylesheet" href="/style.css">
  <script data-goatcounter="https://video-compressor.goatcounter.com/count"
          async src="//gc.zgo.at/count.v5.js"
          crossorigin="anonymous"
          integrity="sha384-atnOLvQb9t+jTSipvd75X2yginT4PjVbqDdlJAmxMm+wYElFmeR6EmLP5bYeoRV"></script>
</head>
<body>

<main class="container">
  <h1>کاهش حجم فیلم</h1>

  <p class="desc">
    فیلم را انتخاب کنید و حجم آن را بدون تغییر وضوح کاهش دهید.
  </p>

  <input
    id="videoInput"
    type="file"
    accept="video/*"
    hidden
  >

  <button id="selectBtn">
    انتخاب فیلم
  </button>

  <div id="status"></div>

  <button id="compressBtn" style="display:none;">
    کاهش حجم
  </button>

  <a
    id="saveLink"
    style="display:none;"
    class="save"
  >
    ذخیره فیلم
  </a>


</main>

<footer class="channel-link">
  <strong>لوازم خانگی عباسی</strong>
  <span class="eitaa-label">Eitaa</span>
  <a href="https://eitaa.com/Abbasihouseholdappliances" target="_blank" rel="noopener">
    https://eitaa.com/Abbasihouseholdappliances
  </a>
</footer>

<div id="visitorCount" class="visitor-count"></div>

<script>
setTimeout(() => {
  if (window.goatcounter && window.goatcounter.visit_count) {
    window.goatcounter.visit_count({
      append: "#visitorCount",
      path: "TOTAL"
    });
  }
}, 500);
</script>

<script type="module" src="/app.js"></script>

</body>
</html>
