<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>کاهش حجم فیلم</title>
  <link rel="stylesheet" href="/style.css">
  <script data-goatcounter="https://video-compressor.goatcounter.com/count"
        data-goatcounter-settings='{"no_session":true}'
          async src="//gc.zgo.at/count.v5.js"
          crossorigin="anonymous"
          integrity="sha384-atnOLvQb9t+jTSipvd75X2yginT4PjVbqDdlJAmxMm+wYElFmeR6EmLP5bYeoRV"></script>
</head>
<body>

<main class="container">
  <h1>کاهش حجم فیلم</h1>

  <p class="desc">
    فیلم را انتخاب کنید و حجم آن را بدون تغییر وضوح کاهش دهید.
  </p>

  <input
    id="videoInput"
    type="file"
    accept="video/*"
    hidden
  >

  <button id="selectBtn">
    انتخاب فیلم
  </button>

  <div id="status"></div>

  <button id="compressBtn" style="display:none;">
    کاهش حجم
  </button>

  <a
    id="saveLink"
    style="display:none;"
    class="save"
  >
    ذخیره فیلم
  </a>


</main>

<footer class="channel-link">
  <strong>لوازم خانگی عباسی</strong>
  <span class="eitaa-label">Eitaa</span>
  <a href="https://eitaa.com/Abbasihouseholdappliances" target="_blank" rel="noopener">
    https://eitaa.com/Abbasihouseholdappliances
  </a>
</footer>

<div id="visitorCount" class="visitor-count">
  👁 تعداد بازدیدکنندگان: در حال دریافت...
</div>

<script>
(async () => {
  const counter = document.getElementById("visitorCount");

  try {
    const response = await fetch(
      "https://video-compressor.goatcounter.com/counter/TOTAL.json?t=" + Date.now(),
      {
        cache: "no-store",
        mode: "cors"
      }
    );

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const data = await response.json();

    if (!data || typeof data.count === "undefined") {
      throw new Error("Invalid counter response");
    }

    counter.textContent = "👁 تعداد بازدیدکنندگان: " + data.count;
  } catch (error) {
    console.error("Visitor counter error:", error);
    counter.textContent = "👁 تعداد بازدیدکنندگان: در دسترس نیست";
  }
})();
</script>

<script type="module" src="/app.js"></script>

</body>
</html>

<section id="chapter2-gold"></section>

<script type="module">
  import "./src/gold/gold.css";
  import { mountGoldSection } from "./src/gold/goldSection.js";

  const chapter2 = document.getElementById("chapter2-gold");

  if (chapter2) {
    mountGoldSection(chapter2);
  }
</script>
